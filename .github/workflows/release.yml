name: Release

# 打 tag（如 v2.10.0）即自动构建单文件成品，并作为 Release 附件发布
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 成品里的版本号取自 package.json，若不与 tag 一致，用户会下载到标错版本的文件
      - name: 校验标签与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(npm pkg get version | tr -d '"')
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 package.json 的版本 ${PKG} 不一致，请先同步版本号再打 tag"
            exit 1
          fi

      - name: 运行测试
        run: npm test

      - name: 构建单文件成品
        run: npm run build

      # Release 正文以 CHANGELOG.md 的当前版本段落为准（含新增 / 修复 / 测试明细），
      # 自动生成的提交列表会追加在其后，因此说明始终与迭代记录一致。
      - name: 从 CHANGELOG 抽取当前版本的更新说明
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const head = `## v${version}`;
          const start = lines.findIndex((line) => line.trim() === head);
          if (start < 0) {
            console.error(`::error::CHANGELOG.md 中未找到 ${head} 段落，请先补充迭代记录`);
            process.exit(1);
          }
          let end = lines.length;
          for (let i = start + 1; i < lines.length; i++) {
            if (/^##\s/.test(lines[i])) { end = i; break; }
          }
          const intro = [
            `# GridSneaker v${version}`,
            '',
            '**本次更新**：界面语言由 4 种扩充到 **10 种**——简体中文 · 繁體中文 · English · 日本語 ·',
            '한국어 · Français · Deutsch · Español · Português · Русский；语言切换器旁新增「Language 语言」',
            '双语标识；脚本未能启动时的兜底提示块同样支持全部 10 种语言。',
            '',
          ].join('\n');
          // 去掉重复的 `## vX.Y.Z` 小标题，正文直接接在 H1 之下
          const body = `${intro}\n${lines.slice(start + 1, end).join('\n').trim()}\n`;
          fs.writeFileSync('release-body.md', body);
          NODE

      - name: 创建 Release 并上传成品 HTML 与更新说明
        uses: softprops/action-gh-release@v2
        with:
          name: GridSneaker ${{ github.ref_name }}
          body_path: release-body.md
          files: GridSneaker.html
          generate_release_notes: true
