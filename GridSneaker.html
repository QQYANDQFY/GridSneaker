<!doctype html>
<html lang="zh-CN">
<head>
  <!-- 让 360 / QQ 等双内核浏览器对本地文件也走极速（Blink）内核，避免兼容模式白屏 -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GridSneaker · 网格移动动画模拟平台</title>
  <style>
/* 网格移动模拟平台样式 */
:root {
  --bg: #0b0e13;
  --panel: #12161d;
  --panel-2: #171c25;
  --line: #242c38;
  --text: #e6edf3;
  --muted: #93a1b1;
  --accent: #4dabf7;
  --accent-2: #51cf66;
  --danger: #ff6b6b;
  --warn: #ffc078;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}

#topbar {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
#topbar h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
#topbar h1 .sub {
  margin-left: 10px;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}
.topbar-hint { color: var(--muted); font-size: 12px; }

#layout {
  display: grid;
  grid-template-columns: minmax(300px, 360px) minmax(0, 1fr) minmax(280px, 340px);
  gap: 12px;
  padding: 12px;
  height: calc(100% - 45px);
  align-items: start;
}
@media (max-width: 1180px) {
  #layout { grid-template-columns: 1fr; height: auto; }
  .panel.scroll { max-height: 60vh; }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px;
}
.panel.scroll {
  overflow-y: auto;
  max-height: calc(100vh - 70px);
}
#stage {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

#canvas-wrap {
  position: relative;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px;
  max-height: calc(100vh - 300px);
}
#canvas { display: block; border-radius: 6px; }

/* 坐标格悬浮提示：固定定位在视口层，确保不被画布容器裁剪、也不被下方 UI 遮挡 */
.tooltip {
  position: fixed;
  left: 0;
  top: 0;
  display: none;
  max-width: min(300px, 60vw);
  white-space: pre-line;
  padding: 6px 9px;
  border-radius: 6px;
  background: rgba(10, 14, 20, 0.96);
  border: 1px solid var(--line);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
  color: var(--text);
  font-size: 12px;
  line-height: 1.55;
  pointer-events: none;
  z-index: 9000;
}
.tooltip.show { display: block; }

/* ---------------- 控件 ---------------- */

.controls {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
}
.controls-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}
.controls-line + .controls-line { border-top: 1px dashed var(--line); }

.btn {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 5px 11px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.05s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: #1c3b5a; border-color: #2f6da8; }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 8px; font-size: 11px; }
.btn.icon { padding: 3px 7px; font-size: 12px; }
.btn.danger { border-color: #6b2b2b; color: #ffb4b4; }
.btn.danger:hover { border-color: var(--danger); }

.input {
  background: #0d1117;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 7px;
  font-size: 12px;
  font-family: inherit;
  min-width: 0;
  width: 100%;
}
.input:focus { outline: none; border-color: var(--accent); }
.input:disabled { opacity: 0.5; cursor: not-allowed; }
.input.tiny { width: auto; min-width: 68px; padding: 2px 5px; font-size: 11px; }
.textarea { resize: vertical; font-family: ui-monospace, Consolas, monospace; line-height: 1.4; }
.checkbox { accent-color: var(--accent); }
.color { width: 34px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; }

.check-wrap { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; }
.range-wrap { display: flex; align-items: center; gap: 8px; width: 100%; }
.range { flex: 1; accent-color: var(--accent); min-width: 80px; }
.range.timeline { width: 100%; }
.range-out { min-width: 34px; text-align: right; color: var(--muted); font-size: 11px; }
.range-num { flex: 0 0 62px; width: 62px; padding: 3px 6px; font-size: 12px; text-align: center; }

/* ---------------- 分组与字段 ---------------- */

/* 多层级选项卡配色
   层级越深：色相沿色环推进 → 饱和度升高 → 亮度升高。
   父级沉稳低调（低饱和深底 + 冷色），子级逐层更鲜明（暖色、更亮的标题与左侧色条），
   于是同一视觉体系下每一层都能被一眼分辨。
   层级配色变量 --grp-h / --grp-s / --grp-l 由 forms.js 的 group() 按实际嵌套深度写入。 */
.group {
  --grp-h: 212;
  --grp-s: 24%;
  --grp-l: 9%;
  --grp-border: hsl(var(--grp-h) calc(var(--grp-s) + 8%) calc(var(--grp-l) + 8%));
  --grp-bar: hsl(var(--grp-h) calc(var(--grp-s) + 34%) calc(var(--grp-l) + 44%));
  background: hsl(var(--grp-h) var(--grp-s) var(--grp-l));
  border: 1px solid var(--grp-border);
  border-left: 3px solid var(--grp-bar);
  border-radius: 9px;
  margin: 8px 0;
}
.group > summary {
  cursor: pointer;
  padding: 8px 10px;
  font-weight: 600;
  font-size: 12.5px;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
  color: hsl(var(--grp-h) calc(var(--grp-s) + 24%) calc(var(--grp-l) + 76%));
}
.group > summary::before { content: "▸"; color: var(--grp-bar); font-size: 11px; }
.group[open] > summary::before { content: "▾"; }
.group > summary .badge {
  font-size: 10px;
  color: hsl(var(--grp-h) calc(var(--grp-s) + 30%) calc(var(--grp-l) + 56%));
  border: 1px solid var(--grp-border);
  border-radius: 20px;
  padding: 0 6px;
}
.group-body { padding: 4px 10px 10px; }

.field { margin: 7px 0; }
.field-label { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 3px; }
.field-hint { display: block; color: #6f7d8c; font-size: 11px; margin-top: 3px; }

.row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.row > .field { flex: 1 1 96px; min-width: 0; }
.row > .check-wrap { padding-bottom: 4px; min-width: 0; }

/*
 * 排序 / 删除按钮簇（↑ ↓ ✕）：
 * 整簇作为一个不可拆分的 flex 项（flex: 0 0 auto + nowrap），
 * 空间足够时贴右显示；空间不足时整簇一起换行，
 * 绝不会出现「↑ 留在上一行、↓ 被挤到下一行」的错位。
 */
.row-actions {
  display: flex;
  flex: 0 0 auto;
  flex-wrap: nowrap;
  align-items: center;
  gap: 4px;
  margin-left: auto;
}
/*
 * 统一簇内按钮的盒模型：↑ ↓ 是窄字形、✕ 是宽字形，若按内容撑高会在同一行内
 * 产生 2px 上下的错位。固定行高 + 居中对齐后三个按钮的盒子完全一致。
 */
.row-actions .btn {
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  min-width: 23px;
  height: 23px;
  padding: 0 6px;
  line-height: 1;
}
.hint { color: #6f7d8c; font-size: 11px; margin: 4px 0; }
.mini-label { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.sub-title { color: var(--accent); font-size: 12px; margin: 10px 0 2px; font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  background: #0d1117;
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 20px;
  padding: 2px 9px;
  font-size: 11px;
  cursor: pointer;
}
.chip.on { background: #1c3b5a; border-color: var(--accent); color: #d7ecff; }
.chips-line { display: flex; gap: 12px; flex-wrap: wrap; }

/* ---------------- 规则编辑 ---------------- */

.rule-list { display: flex; flex-direction: column; }
.condition {
  border-left: 2px solid var(--line);
  padding-left: 8px;
  margin-top: 2px;
}
.clause {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 8px;
  margin: 6px 0;
}
.clause-index {
  min-width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #22303f;
  color: var(--accent);
  font-size: 10.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.action-list { display: flex; flex-direction: column; gap: 6px; }
.action-item {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 8px;
}

/* ---------------- CA 状态与规则 ---------------- */

.state-list { display: flex; flex-direction: column; gap: 5px; }
.state-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.state-row .input { flex: 0 0 84px; }
.state-row select.input { flex: 0 0 70px; width: 70px; }
.swatch { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line); }
.swatch.empty { background: repeating-linear-gradient(45deg, #1b222c, #1b222c 4px, #232c38 4px, #232c38 8px); }
.counts { display: flex; flex-direction: column; gap: 4px; }
.count-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

.end-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 3px 6px;
  border-radius: 7px;
  border: 1px dashed transparent;
  margin: 3px 0;
}
.end-row.on { background: rgba(77, 171, 247, 0.07); border-color: rgba(77, 171, 247, 0.3); }
/* 由「查看结束规则」触发的定位高亮 */
.end-row.target {
  background: rgba(255, 209, 102, 0.16);
  border-color: #ffd166;
  border-style: solid;
  animation: end-row-flash 0.5s ease-in-out 4 alternate;
}
@keyframes end-row-flash {
  from { box-shadow: 0 0 0 0 rgba(255, 209, 102, 0); }
  to { box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.32); }
}
.end-row .field { margin: 0; flex: 0 1 118px; min-width: 54px; }
.end-row .field-label { margin-bottom: 1px; }
/* 优先级行：勾选项可收缩，按钮簇不换行（详见 .row-actions） */
.end-row > .check-wrap { flex: 1 1 auto; min-width: 0; }
.end-row .row-actions { align-items: center; }
.speed-wrap { width: auto; flex: 0 1 320px; }
.priority-no {
  flex: 0 0 auto;
  width: 18px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
}

/* ---------------- 统计 ---------------- */

.stage-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
}
.stat {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 4px 8px;
  min-width: 96px;
}
.stat.wide { flex: 1 1 100%; }
.stat-label { display: block; color: var(--muted); font-size: 10.5px; }
.stat-value { font-size: 13px; font-weight: 600; }
/* 统计口径切换：数值在原节点上更新，只用一次淡入过渡提示「数据已重算」 */
.stage-stats.stat-switch .stat-value { animation: stat-fade 0.24s ease; }
@keyframes stat-fade {
  from { opacity: 0.25; }
  to { opacity: 1; }
}
.mode-switch {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  margin: 4px 0 2px;
}
.mode-switch .btn.mode-btn {
  border: none;
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  padding: 5px 12px;
  font-size: 12px;
}
.mode-switch .btn.mode-btn + .btn.mode-btn { border-left: 1px solid var(--line); }
.mode-switch .btn.mode-btn.on { background: #1c3b5a; color: #d7ecff; }
.spark { display: block; width: 100%; max-width: 260px; height: 44px; }

.bars { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
.bar-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.bar-label { width: 28px; color: var(--muted); }
.bar-track { flex: 1; height: 7px; background: #0d1117; border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; }
.bar-val { width: 92px; text-align: right; color: var(--muted); }

/* ---------------- 日志 ---------------- */

.log-list {
  max-height: 340px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0d1117;
}
.log-item {
  display: grid;
  grid-template-columns: 44px 84px 96px 1fr;
  gap: 6px;
  padding: 4px 7px;
  border-bottom: 1px solid #161c25;
  font-size: 11.5px;
  cursor: pointer;
  align-items: baseline;
}
.log-item:hover { background: #121924; }
.log-item.active { background: rgba(77, 171, 247, 0.16); outline: 1px solid rgba(77, 171, 247, 0.45); }
.log-item.skipped { opacity: 0.55; }
.log-tick { color: var(--accent); }
.log-rule { color: #ffd43b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-sub { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-text { color: #c8d3de; }
@media (max-width: 1400px) {
  .log-item { grid-template-columns: 40px 1fr; }
  .log-item .log-sub, .log-item .log-text { grid-column: 2; }
}

/* ---------------- 坐标筛选查询 ---------------- */

.hidden { display: none !important; }
/* 范围配置行：下行标签 + 数值框 + 滑块 */
.range-rows { display: flex; flex-direction: column; gap: 4px; }
.range-line { display: flex; align-items: center; gap: 6px; }
.range-tag { flex: 0 0 26px; color: var(--muted); font-size: 11px; }
.range-line .input { flex: 0 0 66px; width: 66px; padding: 3px 6px; font-size: 12px; text-align: center; }
.range.query-range { flex: 1 1 auto; min-width: 60px; }
.query-error {
  color: #ffb4b4;
  background: rgba(255, 107, 107, 0.08);
  border: 1px solid #6b2b2b;
  border-radius: 7px;
  padding: 5px 8px;
  font-size: 11px;
  margin: 6px 0;
}
.query-loading {
  color: #ffd166;
  font-size: 11px;
  margin: 6px 0;
}
.query-loading::before {
  content: "◌ ";
  animation: query-spin 1s linear infinite;
  display: inline-block;
}
@keyframes query-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.query-preset { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 2px; }
.query-preset .field { margin: 5px 0; }
.query-dash { color: var(--muted); font-size: 12px; padding: 0 2px; }
.query-list {
  max-height: 260px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0d1117;
}
.query-item {
  display: grid;
  grid-template-columns: 84px 62px 72px 1fr;
  gap: 6px;
  padding: 4px 7px;
  border-bottom: 1px solid #161c25;
  font-size: 11.5px;
  cursor: pointer;
  align-items: baseline;
}
.query-item:hover { background: #121924; }
.query-coord { color: #ffd43b; font-variant-numeric: tabular-nums; }
.query-meta { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 1400px) {
  .query-item { grid-template-columns: 84px 1fr; }
  .query-item .query-meta { grid-column: 2; }
}

/* ---------------- 轨迹快照对比 ---------------- */

.compare-stat { white-space: pre-line; }
.compare-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0d1117;
  padding: 5px 7px;
}
.compare-item {
  font-size: 11.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.compare-item:first-child { color: var(--text); }

.frame-label { color: var(--muted); font-size: 12px; white-space: nowrap; }
.end-label {
  color: var(--accent-2);
  font-size: 12px;
  font-weight: 600;
}
.end-label.ended { color: var(--warn); }

/* ---------------- 得分与难度 ---------------- */

.score-label {
  color: var(--accent-2);
  font-size: 12px;
  font-weight: 600;
}
.score-label.record { color: #ffd166; }

/* ---------------- Toast ---------------- */

.toast-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
}
.toast {
  min-width: 180px;
  max-width: 320px;
  padding: 8px 12px;
  border-radius: 8px;
  background: #16202c;
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 12px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: none; }
.toast.success { border-color: #2f6b41; }
.toast.warn {
  border: 2px solid var(--warn);
  background: #2b2110;
  color: #ffe3b8;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(255, 192, 120, 0.22);
}
.toast.error { border: 2px solid var(--danger); background: #2a1517; color: #ffd3d3; font-weight: 600; }

/* 面板内的醒目警告条（如「蛇长度可变」未启用时的状态校验提示） */
.alert {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 8px 0;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.5;
}
.alert .alert-icon { font-size: 14px; line-height: 1.3; }
.alert .alert-text { flex: 1; min-width: 0; }
.alert .alert-text strong { display: block; margin-bottom: 2px; }
.alert.warn {
  border: 1px solid var(--warn);
  border-left: 4px solid var(--warn);
  background: #2b2110;
  color: #ffe3b8;
  box-shadow: 0 0 0 1px rgba(255, 192, 120, 0.12) inset;
}

/* ---------------- 配置诊断 ---------------- */

.diag-ok { color: var(--accent-2); font-size: 12px; padding: 2px 0; }
.diag-item {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-left-width: 3px;
  border-radius: 8px;
  padding: 7px 9px;
  margin: 6px 0;
}
.diag-item.error { border-left-color: var(--danger); }
.diag-item.warning { border-left-color: var(--warn); }
.diag-item.info { border-left-color: var(--accent); }
.diag-head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.diag-level {
  flex: 0 0 auto;
  font-size: 10px;
  line-height: 16px;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 0 6px;
  color: var(--muted);
}
.diag-level.error { color: #ffb3b3; border-color: #7a2d2d; }
.diag-level.warning { color: #ffd9a8; border-color: #7a5a23; }
.diag-level.info { color: #bfe0ff; border-color: #2b5675; }
.diag-title { font-size: 12.5px; font-weight: 600; }
.diag-msg { color: var(--muted); font-size: 11.5px; line-height: 1.6; }
.diag-fixes { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 6px; }
.diag-fix-label { color: #6f7d8c; font-size: 11px; }

/* ------------------------------------------------------------------ */
/* 规范化                                                              */
/* ------------------------------------------------------------------ */

const num = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : d);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const bool = (v, d) => (v === undefined || v === null ? d : !!v);
const str = (v, d) => (v === undefined || v === null ? d : String(v));

const COMPARATORS = ['>=', '<=', '==', '>', '<', '!='];
function normComparator(c, d = '>=') {
  return COMPARATORS.includes(c) ? c : d;
}

const HEX_COLOR = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
/** 自定义色带：仅保留合法的十六进制颜色，为空时回退到默认色带 */
function normColorList(v, fallback) {
  if (!Array.isArray(v)) return [...fallback];
  const list = v.map((c) => String(c).trim()).filter((c) => HEX_COLOR.test(c));
  return list.length ? list : [...fallback];
}

function normClause(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const invert = !!raw.invert;
  // 支持简写：{neighborhood, objects, count:{min,max,exact}}
  if (!raw.type && (raw.objects || raw.neighborhood || raw.count)) {
    const kind = normNeighborhood(raw.neighborhood || raw.kind);
    const radius = clamp(num(raw.radius, 1), 1, 12);
    const objects = normObjects(raw.objects);
    const count = raw.count;
    if (count && typeof count === 'object') {
      const clauses = [];
      if (count.min !== undefined) clauses.push({ type: 'count', kind, radius, objects, comparator: '>=', value: num(count.min, 1), invert, includeSelf: !!raw.includeSelf });
      if (count.max !== undefined) clauses.push({ type: 'count', kind, radius, objects, comparator: '<=', value: num(count.max, 1), invert, includeSelf: !!raw.includeSelf });
      if (count.exact !== undefined || count.equals !== undefined) {
        clauses.push({ type: 'count', kind, radius, objects, comparator: '==', value: num(count.exact ?? count.equals, 1), invert, includeSelf: !!raw.includeSelf });
      }
      if (count.value !== undefined) {
        clauses.push({ type: 'count', kind, radius, objects, comparator: normComparator(count.comparator), value: num(count.value, 1), invert, includeSelf: !!raw.includeSelf });
      }
      if (clauses.length === 1) return clauses[0];
      if (clauses.length > 1) return { type: 'group', logic: 'and', invert: false, clauses };
    }
    return { type: 'count', kind, radius, objects, comparator: '>=', value: 1, invert, includeSelf: !!raw.includeSelf };
  }

  const t = str(raw.type, 'count');
  const kind = normNeighborhood(raw.kind || raw.neighborhood);
  const radius = clamp(num(raw.radius, 1), 1, 12);
  switch (t) {
    case 'count':
      return { type: 'count', kind, radius, objects: normObjects(raw.objects), comparator: normComparator(raw.comparator), value: num(raw.value, 1), invert, includeSelf: !!raw.includeSelf };
    case 'proportion':
      return { type: 'proportion', kind, radius, objects: normObjects(raw.objects), comparator: normComparator(raw.comparator, '<'), value: num(raw.value, 0.3), invert, includeSelf: !!raw.includeSelf };
    case 'exists':
      return { type: 'exists', kind, radius, objects: normObjects(raw.objects), invert };
    case 'direction':
      return { type: 'direction', objects: normObjects(raw.objects), rel: str(raw.rel, 'front'), distance: clamp(num(raw.distance, 1), 1, 12), invert };
    case 'pattern':
      return { type: 'pattern', pattern: str(raw.pattern, ''), invert };
    case 'distance':
      return { type: 'distance', objects: normObjects(raw.objects), comparator: normComparator(raw.comparator, '<='), value: num(raw.value, 2), invert };
    case 'stat':
      return { type: 'stat', key: str(raw.key, 'steps'), comparator: normComparator(raw.comparator), value: num(raw.value, 10), invert };
    case 'selfLength':
      return { type: 'selfLength', comparator: normComparator(raw.comparator), value: num(raw.value, 10), invert };
    case 'agentCount':
      return { type: 'agentCount', comparator: normComparator(raw.comparator), value: num(raw.value, 2), invert };
    case 'cellState':
      return { type: 'cellState', position: str(raw.position, 'front'), state: str(raw.state, 'obstacle'), invert };
    case 'random':
      return { type: 'random', probability: clamp(num(raw.probability, 0.5), 0, 1), invert };
    case 'group': {
      const clauses = (Array.isArray(raw.clauses) ? raw.clauses : []).map(normClause).filter(Boolean);
      return { type: 'group', logic: raw.logic === 'or' ? 'or' : 'and', invert, clauses };
    }
    default:
      return { type: 'count', kind, radius, objects: ['obstacle'], comparator: '>=', value: 1, invert, includeSelf: false };
  }
}

function normNeighborhood(v) {
  const s = str(v, 'moore').toLowerCase();
  if (['vonneumann', 'von_neumann', 'neumann', '4', 'four'].includes(s)) return 'vonNeumann';
  if (['moore', '8', 'eight'].includes(s)) return 'moore';
  if (['hex', 'hexagonal', '6'].includes(s)) return 'hex';
  if (['radius', 'r'].includes(s)) return 'radius';
  return 'moore';
}

function normObjects(v) {
  if (Array.isArray(v)) {
    const list = v.map(String).filter(Boolean);
    return list.length ? list : ['obstacle'];
  }
  if (typeof v === 'string' && v) return [v];
  return ['obstacle'];
}

function normAction(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const type = str(raw.type, '');
  const a = { ...raw, type };
  switch (type) {
    case 'forceTurn':
      a.turn = str(raw.turn ?? raw.direction ?? 'right', 'right');
      a.probability = clamp(num(raw.probability, 1), 0, 1);
      return a;
    case 'randomTurn':
      a.weights = {
        left: Math.max(0, num(raw.weights?.left, 1)),
        straight: Math.max(0, num(raw.weights?.straight, 1)),
        right: Math.max(0, num(raw.weights?.right, 1)),
      };
      return a;
    case 'createObstacle':
    case 'createMarker':
      a.position = str(raw.position, 'current');
      a.count = clamp(num(raw.count, 1), 1, 64);
      return a;
    case 'removeObstacle':
    case 'removeMarker':
      a.position = str(raw.position, 'current');
      return a;
    case 'setCellState':
      a.position = str(raw.position, 'front');
      a.state = str(raw.state, 'obstacle');
      return a;
    case 'clearState':
      a.state = str(raw.state, 'obstacle');
      return a;
    case 'changeLength':
      a.amount = Math.round(num(raw.amount, 1));
      return a;
    case 'setLength':
      a.value = clamp(Math.round(num(raw.value, 3)), 1, 100000);
      return a;
    case 'changeSpeed':
      a.factor = num(raw.factor, 1.5);
      return a;
    case 'spawnAgent':
      a.length = clamp(Math.round(num(raw.length, 3)), 1, 200);
      a.direction = str(raw.direction, 'random');
      return a;
    case 'removeAgent':
      a.target = ['nearest', 'random', 'largest', 'oldest'].includes(raw.target) ? raw.target : 'nearest';
      return a;
    case 'modifyRule':
      a.ruleId = str(raw.ruleId, '');
      a.op = str(raw.op, 'disable');
      a.value = num(raw.value, 0);
      return a;
    case 'endRun':
      a.reason = str(raw.reason, '环境规则结束');
      return a;
    case 'log':
      a.message = str(raw.message, '触发');
      return a;
    case 'paintTrail':
      a.position = str(raw.position, 'current');
      a.state = str(raw.state, 'trail');
      return a;
    default:
      return a;
  }
}

function normalizeCondition(raw) {
  if (!raw) return { logic: 'and', clauses: [] };
  if (Array.isArray(raw)) return { logic: 'and', clauses: raw.map(normClause).filter(Boolean) };
  if (raw.clauses) {
    return { logic: raw.logic === 'or' ? 'or' : 'and', clauses: raw.clauses.map(normClause).filter(Boolean) };
  }
  const c = normClause(raw);
  return { logic: 'and', clauses: c ? [c] : [] };
}

function normalizeRule(raw = {}) {
  const subjects = ['head', 'body', 'headAndBody', 'anySegment', 'segment', 'allAgents', 'cell'];
  const triggers = ['beforeStep', 'afterStep', 'onEnter', 'onCollision', 'onBoundary', 'timer', 'manual'];
  return {
    id: str(raw.id, `rule_${Math.random().toString(36).slice(2, 8)}`),
    name: str(raw.name, '未命名规则'),
    enabled: bool(raw.enabled, true),
    subject: subjects.includes(raw.subject) ? raw.subject : 'head',
    segmentIndex: Math.round(num(raw.segmentIndex, 1)),
    trigger: triggers.includes(raw.trigger) ? raw.trigger : 'afterStep',
    interval: clamp(Math.round(num(raw.interval, 5)), 1, 100000),
    condition: normalizeCondition(raw.condition),
    actions: (Array.isArray(raw.actions) ? raw.actions : []).map(normAction).filter(Boolean),
    priority: Math.round(num(raw.priority, 1)),
    probability: clamp(num(raw.probability, 1), 0, 1),
    cooldown: clamp(Math.round(num(raw.cooldown, 0)), 0, 100000),
    maxTriggers: clamp(Math.round(num(raw.maxTriggers, 0)), 0, 1000000),
    once: !!raw.once,
  };
}

function normLengthPolicy(raw = {}) {
  const d = defaultConfig().body.lengthPolicy;
  const mode = ['fixed', 'variable', 'custom'].includes(raw.mode) ? raw.mode : 'fixed';
  const normSub = (s, def) => ({
    enabled: bool(s?.enabled, def.enabled),
    trigger: ['step', 'eat', 'collision', 'event', 'timer'].includes(s?.trigger) ? s.trigger : def.trigger,
    amount: Math.round(num(s?.amount, def.amount)),
    probability: clamp(num(s?.probability, def.probability), 0, 1),
    interval: clamp(Math.round(num(s?.interval, def.interval)), 1, 100000),
    maxLength: clamp(Math.round(num(s?.maxLength ?? def.maxLength, def.maxLength)), 1, 100000),
    minLength: clamp(Math.round(num(s?.minLength ?? def.minLength, def.minLength)), 1, 100000),
  });
  return {
    mode,
    growth: normSub(raw.growth, d.growth),
    shrink: normSub(raw.shrink, d.shrink),
  };
}

function normAdvancedRules(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map((r) => ({
    id: str(r.id, `adv_${Math.random().toString(36).slice(2, 8)}`),
    enabled: bool(r.enabled, true),
    name: str(r.name, '条件概率'),
    condition: normalizeCondition(r.condition || r.when || null),
    moves: {
      left: Math.max(0, num(r.moves?.left, 0.33)),
      straight: Math.max(0, num(r.moves?.straight, 0.34)),
      right: Math.max(0, num(r.moves?.right, 0.33)),
    },
    priority: Math.round(num(r.priority, 1)),
  }));
}

function normCaRules(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map((r, i) => {
    const counts = Array.isArray(r.counts)
      ? r.counts.map((c) => ({
        state: str(c.state, 'alive'),
        values: Array.isArray(c.values) ? c.values.map((v) => Math.round(num(v, 0))) : null,
        min: c.min !== undefined ? Math.round(num(c.min, 0)) : null,
        max: c.max !== undefined ? Math.round(num(c.max, 0)) : null,
      }))
      : [];
    return {
      id: str(r.id, `ca_${i}`),
      name: str(r.name, `规则 ${i + 1}`),
      enabled: bool(r.enabled, true),
      kind: ['count', 'traffic'].includes(r.kind) ? r.kind : 'count',
      from: Array.isArray(r.from) ? r.from.map(String) : r.from === '*' || !r.from ? '*' : [String(r.from)],
      counts,
      to: str(r.to, 'empty'),
      probability: clamp(num(r.probability, 1), 0, 1),
      direction: str(r.direction, 'east'),
    };
  });
}

/** 轨迹 / 蛇身的连接方式 */
const JOIN_MODES = ['curve', 'line', 'angle'];

/** 轨迹亮度衰减模式：线性 / 指数 */
const FADE_MODES = ['linear', 'exponential'];

/** 轨迹衰减步长的允许范围（步） */
const FADE_LENGTH_LIMIT = { min: 2, max: 2000 };

/**
 * 连接方式规范化：
 * 优先读取 trailJoin / bodyJoin；旧配置只有 smoothTrail / smoothBody 布尔值时按
 * 「开 = 曲线，关 = 直线」换算，保证历史配置与分享链接的表现不变。
 */
function normJoin(raw, joinKey, smoothKey, fallback) {
  if (JOIN_MODES.includes(raw[joinKey])) return raw[joinKey];
  if (raw[joinKey] !== undefined) return fallback;
  return bool(raw[smoothKey], fallback === 'curve') ? 'curve' : 'line';
}

function normalizeStyle(raw = {}) {
  const d = defaultConfig().style;
  const trailJoin = normJoin(raw, 'trailJoin', 'smoothTrail', d.trailJoin);
  const bodyJoin = normJoin(raw, 'bodyJoin', 'smoothBody', d.bodyJoin);
  return {
    ...d,
    ...raw,
    cellSize: clamp(num(raw.cellSize, d.cellSize), 6, 120),
    gap: clamp(num(raw.gap, d.gap), 0, 20),
    darkMode: bool(raw.darkMode, d.darkMode),
    showGrid: bool(raw.showGrid, d.showGrid),
    showTrail: bool(raw.showTrail, d.showTrail),
    showBody: bool(raw.showBody, d.showBody),
    showArrows: bool(raw.showArrows, d.showArrows),
    showCoords: bool(raw.showCoords, d.showCoords),
    showObstacles: bool(raw.showObstacles, d.showObstacles),
    showMarkers: bool(raw.showMarkers, d.showMarkers),
    highlightRules: bool(raw.highlightRules, d.highlightRules),
    showStartEnd: bool(raw.showStartEnd, d.showStartEnd),
    trailFade: bool(raw.trailFade, d.trailFade),
    fadeMode: FADE_MODES.includes(raw.fadeMode) ? raw.fadeMode : d.fadeMode,
    fadeLength: clamp(num(raw.fadeLength, d.fadeLength), FADE_LENGTH_LIMIT.min, FADE_LENGTH_LIMIT.max),
    axisLabels: bool(raw.axisLabels, d.axisLabels),
    showEyes: bool(raw.showEyes, d.showEyes),
    showEffects: bool(raw.showEffects, d.showEffects),
    glow: bool(raw.glow, d.glow),
    trailJoin,
    bodyJoin,
    trailAngle: clamp(num(raw.trailAngle, d.trailAngle), 5, 85),
    smoothTrail: trailJoin === 'curve',
    smoothBody: bodyJoin === 'curve',
    followAgent: bool(raw.followAgent, d.followAgent),
  };
}

/** 安全避撞预设 */
function normSafety(raw = {}) {
  const d = defaultConfig().safety;
  return {
    avoidBody: bool(raw.avoidBody, d.avoidBody),
    avoidObstacle: bool(raw.avoidObstacle, d.avoidObstacle),
    avoidOtherAgents: bool(raw.avoidOtherAgents, d.avoidOtherAgents),
  };
}

/** 标记物交互反馈规则表 */
function normMarkerEffects(raw) {
  const d = defaultConfig().caMode.markerInteraction.effects;
  const list = Array.isArray(raw) ? raw : d;
  const out = list.map((e, i) => ({
    id: str(e?.id, `fx_${i}`),
    name: str(e?.name, `反馈 ${i + 1}`),
    enabled: bool(e?.enabled, true),
    state: str(e?.state, 'marker'),
    mode: ['set', 'percent'].includes(e?.mode) ? e.mode : 'delta',
    value: Math.round(num(e?.value, 1)),
    probability: clamp(num(e?.probability, 1), 0, 1),
    consume: bool(e?.consume, true),
    consumeTo: str(e?.consumeTo, 'empty'),
    color: HEX_COLOR.test(String(e?.color || '')) ? String(e.color) : '',
  }));
  return out;
}

function normCaMarkerInteraction(raw = {}) {
  const d = defaultConfig().caMode.markerInteraction;
  const states = Array.isArray(raw.states) && raw.states.length ? raw.states.map(String) : [...d.states];
  return {
    enabled: bool(raw.enabled, d.enabled),
    states,
    effects: normMarkerEffects(raw.effects),
  };
}

function normMultiSnake(raw = {}) {
  const d = defaultConfig().multiSnake;
  const sp = raw.spawn || {};
  const it = raw.interaction || {};
  const palette = normColorList(it.colorPalette, d.interaction.colorPalette);
  return {
    enabled: bool(raw.enabled, d.enabled),
    spawn: {
      mode: SPAWN_MODES.includes(sp.mode) ? sp.mode : d.spawn.mode,
      times: (Array.isArray(sp.times) ? sp.times : d.spawn.times)
        .map((v) => Math.round(num(v, 0)))
        .filter((v) => v > 0)
        .sort((a, b) => a - b),
      minInterval: clamp(Math.round(num(sp.minInterval, d.spawn.minInterval)), 1, 100000),
      maxInterval: clamp(Math.round(num(sp.maxInterval, d.spawn.maxInterval)), 1, 100000),
      maxAgents: clamp(Math.round(num(sp.maxAgents, d.spawn.maxAgents)), 1, 64),
      length: clamp(Math.round(num(sp.length, d.spawn.length)), 1, 200),
      direction: str(sp.direction, d.spawn.direction),
      events: (Array.isArray(sp.events) ? sp.events : d.spawn.events).map(String).filter((e) => SPAWN_EVENTS.includes(e)),
      probability: clamp(num(sp.probability, d.spawn.probability), 0, 1),
    },
    interaction: {
      mode: INTERACTION_MODES.includes(it.mode) ? it.mode : d.interaction.mode,
      colorPalette: palette,
    },
  };
}

/**
 * 规范化 + 迁移。支持规范完整格式，也支持需求文档中的紧凑格式（x/y、rules、count.min 等）。
 */
function normalizeConfig(rawInput = {}) {
  const raw = migrate(rawInput);
  const d = defaultConfig();

  const gridRaw = raw.grid || {};
  const grid = {
    type: gridRaw.type === 'hex' ? 'hex' : 'square',
    width: clamp(Math.round(num(gridRaw.width, d.grid.width)), 2, 400),
    height: clamp(Math.round(num(gridRaw.height, d.grid.height)), 2, 400),
    boundary: ['stop', 'bounce', 'wrap', 'randomTurn', 'custom'].includes(gridRaw.boundary) ? gridRaw.boundary : 'stop',
  };

  const startRaw = raw.start || {};
  const start = {
    col: gridRaw.type === 'hex'
      ? clamp(Math.round(num(startRaw.col ?? startRaw.x, d.start.col)), 0, grid.width - 1)
      : clamp(Math.round(num(startRaw.col ?? startRaw.x, d.start.col)), 0, grid.width - 1),
    row: clamp(Math.round(num(startRaw.row ?? startRaw.y, d.start.row)), 0, grid.height - 1),
    direction: str(startRaw.direction, d.start.direction),
  };

  const bodyRaw = raw.body || {};
  const body = {
    // 初始长度允许 0：与 enabled=false 等效，均表示「不生成蛇形实体」
    enabled: bool(bodyRaw.enabled, d.body.enabled),
    initialLength: clamp(Math.round(num(bodyRaw.initialLength, d.body.initialLength)), 0, 100000),
    segmentSize: clamp(num(bodyRaw.segmentSize, d.body.segmentSize), 0.1, 1.6),
    shape: ['round', 'square', 'hexagon'].includes(bodyRaw.shape) ? bodyRaw.shape : d.body.shape,
    colorMode: ['gradient', 'solid', 'custom'].includes(bodyRaw.colorMode) ? bodyRaw.colorMode : d.body.colorMode,
    colors: {
      ...d.body.colors,
      ...(bodyRaw.colors || {}),
      custom: normColorList(bodyRaw.colors?.custom, d.body.colors.custom),
    },
    lengthPolicy: normLengthPolicy(bodyRaw.lengthPolicy),
  };

  const movesRaw = raw.moveRules || raw.rules || raw.moves || {};
  const moveRules = {
    left: Math.max(0, num(movesRaw.left, d.moveRules.left)),
    straight: Math.max(0, num(movesRaw.straight, d.moveRules.straight)),
    right: Math.max(0, num(movesRaw.right, d.moveRules.right)),
  };

  const collisionRaw = raw.collision || {};
  const collision = {
    headIntoBody: bool(collisionRaw.headIntoBody, true),
    headIntoTail: bool(collisionRaw.headIntoTail, false),
    wall: bool(collisionRaw.wall, true),
    outOfBounds: bool(collisionRaw.outOfBounds, true),
    obstacle: ['stop', 'destroy', 'pass', 'turn'].includes(collisionRaw.obstacle) ? collisionRaw.obstacle : 'stop',
    countMode: collisionRaw.countMode === 'consecutive' ? 'consecutive' : 'total',
  };

  const scRaw = raw.selfCollisionPolicy || {};
  const selfCollisionPolicy = {
    action: ['stop', 'forceStraight', 'forceStraightN', 'ignore', 'randomTurn', 'custom'].includes(scRaw.action) ? scRaw.action : 'stop',
    n: clamp(Math.round(num(scRaw.n, 2)), 1, 1000),
    maxConsecutive: clamp(Math.round(num(scRaw.maxConsecutive, 5)), 1, 100000),
  };

  const endRaw = raw.endConditions || {};
  const endConditions = { ...d.endConditions, ...endRaw };
  endConditions.priority = Array.isArray(endRaw.priority) && endRaw.priority.length
    ? endRaw.priority.filter((p) => END_PRIORITY_DEFAULT.includes(p)).concat(
      END_PRIORITY_DEFAULT.filter((p) => !endRaw.priority.includes(p)),
    )
    : [...END_PRIORITY_DEFAULT];
  for (const k of ['wall', 'outOfBounds', 'selfCollision', 'selfCollisionTotal', 'selfCollisionConsecutive', 'obstacle', 'lengthReached', 'coverage', 'noMove', 'maxTime', 'ruleEnd', 'caStable', 'allAgentsGone']) {
    endConditions[k] = bool(endConditions[k], d.endConditions[k]);
  }
  // maxSteps 同时承载「是否启用」与「步数上限」：显式 false 表示未启用，必须原样保留，
  // 否则会被当作 0 收敛成 1，导致取消勾选后只走一步就停止。
  endConditions.maxSteps = endRaw.maxSteps === false
    ? false
    : clamp(Math.round(num(endRaw.maxSteps, d.endConditions.maxSteps)), 1, MAX_STEPS_LIMIT);
  endConditions.maxTimeMs = clamp(num(endRaw.maxTimeMs, d.endConditions.maxTimeMs), 1, 3600000);
  endConditions.selfCollisionTotalN = clamp(Math.round(num(endRaw.selfCollisionTotalN, 3)), 1, 100000);
  endConditions.selfCollisionConsecutiveN = clamp(Math.round(num(endRaw.selfCollisionConsecutiveN, 3)), 1, 100000);
  endConditions.lengthTarget = clamp(Math.round(num(endRaw.lengthTarget, 50)), 1, 100000);
  endConditions.coveragePercent = clamp(num(endRaw.coveragePercent, 80), 1, 100);

  const caRaw = raw.caMode || {};
  const caMode = {
    enabled: bool(caRaw.enabled, false),
    states: normalizeStates(caRaw.states),
    neighborhood: normNeighborhood(caRaw.neighborhood),
    radius: clamp(Math.round(num(caRaw.radius, 1)), 1, 4),
    boundary: ['fixed', 'wrap', 'reflect'].includes(caRaw.boundary) ? caRaw.boundary : 'wrap',
    update: ['synchronous', 'asynchronous', 'random'].includes(caRaw.update) ? caRaw.update : 'synchronous',
    rules: normCaRules(caRaw.rules),
    initial: {
      mode: ['empty', 'random', 'pattern'].includes(caRaw.initial?.mode) ? caRaw.initial.mode : 'empty',
      density: clamp(num(caRaw.initial?.density, 0.3), 0, 1),
      state: str(caRaw.initial?.state, caRaw.states?.[1]?.name || 'obstacle'),
      pattern: str(caRaw.initial?.pattern, ''),
    },
    syncWithAgent: ['beforeMove', 'afterMove', 'interleaved', 'everyN'].includes(caRaw.syncWithAgent) ? caRaw.syncWithAgent : 'afterMove',
    every: clamp(Math.round(num(caRaw.every, 1)), 1, 1000),
    stopWhenAgentEnds: bool(caRaw.stopWhenAgentEnds, false),
    stopOnStable: bool(caRaw.stopOnStable, false),
    stableSteps: clamp(Math.round(num(caRaw.stableSteps, 3)), 1, 1000),
    markerInteraction: normCaMarkerInteraction(caRaw.markerInteraction),
  };

  // caMode.stopOnStable 是「CA 稳定即收尾」的快捷开关，开启时强制打开对应结束条件，
  // 保证它参与优先级排序（优先级表里没有的项不会触发）。
  if (caMode.stopOnStable) endConditions.caStable = true;

  const envRules = Array.isArray(raw.environmentRules) ? raw.environmentRules : [];
  const environmentRules = envRules.map(normalizeRule);

  const cfg = {
    version: CONFIG_VERSION,
    meta: { name: str(raw.meta?.name, d.meta.name), description: str(raw.meta?.description, d.meta.description) },
    grid,
    start,
    body,
    moveRules,
    safety: normSafety(raw.safety),
    multiSnake: normMultiSnake(raw.multiSnake),
    ruleExecution: raw.ruleExecution === 'sync' ? 'sync' : 'async',
    advancedRules: normAdvancedRules(raw.advancedRules),
    collision,
    selfCollisionPolicy,
    environmentRules,
    caMode,
    endConditions,
    seed: Math.abs(Math.round(num(raw.seed, d.seed))) || 1,
    speed: clamp(num(raw.speed, d.speed), 0.5, 120),
    style: normalizeStyle(raw.style),
  };

  // 保证同一场景中状态集合一致（agent 感知需要 obstacles/markers 存在）
  ensureCoreStates(cfg);
  return cfg;
}

/** 若规则/CA 配置引用了不存在的基础状态，则补齐 empty/obstacle/marker */
function ensureCoreStates(cfg) {
  const names = new Set(cfg.caMode.states.map((s) => s.name));
  let changed = false;
  const need = [];
  if (!names.has('obstacle')) { need.push(DEFAULT_STATES[1]); names.add('obstacle'); changed = true; }
  if (!names.has('marker')) { need.push(DEFAULT_STATES[2]); names.add('marker'); changed = true; }
  if (changed) cfg.caMode.states = normalizeStates([...cfg.caMode.states, ...need]);
}

/* ------------------------------------------------------------------ */
/* 版本迁移                                                            */
/* ------------------------------------------------------------------ */

function migrate(raw) {
  if (!raw || typeof raw !== 'object') return {};
  const out = JSON.parse(JSON.stringify(raw));
  const v = String(out.version || '1.0');
  const notes = [];

  if (!out.version) {
    // 无版本号：视为最初的紧凑格式
    notes.push('缺少版本号，已按 1.0 兼容模式导入');
  }
  if (v.startsWith('1.0')) {
    // 1.0 -> 1.1：start.x/y -> col/row；rules -> moveRules；condition 简写
    if (out.rules && !out.moveRules) out.moveRules = out.rules;
    if (out.body?.lengthPolicy?.growth && out.body.lengthPolicy.growth.maxLength === undefined) {
      out.body.lengthPolicy.growth.maxLength = 50;
    }
    notes.push('配置已从 1.0 迁移到 ' + CONFIG_VERSION);
  }
  out.version = CONFIG_VERSION;
  if (notes.length) out.migrationNotes = notes;
  return out;
}

/* ------------------------------------------------------------------ */
/* 结构化诊断                                                          */
/* ------------------------------------------------------------------ */

/**
 * 诊断级别：
 *  - error   严重：当前配置在地图尺寸下不可能正确运行（蛇身放不下、起点被堵死等）
 *  - warning 警告：能运行，但结果很可能不符合预期
 *  - info    提示
 * 每条诊断附带 suggestions：[{ label, patch }]，patch 为可直接深合并回配置的部分配置，
 * 供界面「一键修复」，也便于脚本化修正。
 */

const DIAG_LEVELS = ['error', 'warning', 'info'];

const GRID_MAX = 400;

/**
 * 蛇形实体是否启用。
 * 「完全禁用蛇形实体」支持两种等效写法：body.enabled = false，或 initialLength = 0。
 */
function isBodyEnabled(cfg) {
  const c = cfg || {};
  const len = Math.round(Number(c.body?.initialLength) || 0);
  return c.body?.enabled !== false && len > 0;
}

/** 地图中心坐标 */
function centerCoord(grid) {
  return {
    col: Math.min(grid.width - 1, Math.max(0, Math.floor(grid.width / 2))),
    row: Math.min(grid.height - 1, Math.max(0, Math.floor(grid.height / 2))),
  };
}

/** 容纳 cells 个格子所需的网格尺寸（尽量维持原宽高比，限制在 2..400） */
function gridSizeFor(cells, width, height) {
  const w = clamp(Math.ceil(Math.sqrt((cells * Math.max(1, width)) / Math.max(1, height))), 2, GRID_MAX);
  const size = { width: w, height: clamp(Math.ceil(cells / w), 2, GRID_MAX) };
  while (size.width * size.height < cells) {
    if (size.width <= size.height && size.width < GRID_MAX) size.width++;
    else if (size.height < GRID_MAX) size.height++;
    else break;
  }
  return size;
}

/**
 * 方格图上扩大网格并（必要时）挪动起点，使长度 length 的身体能沿 dirs 的反方向完整铺开。
 * 返回 { width, height, start }，无法容纳（超过 400）时返回 null；六边形不做推算。
 */
function expandGridForBody(grid, start, dirs, length) {
  if (grid.type !== 'square') return null;
  let width = grid.width;
  let height = grid.height;
  let col = start.col;
  let row = start.row;
  for (const d of dirs) {
    const name = grid.dirNames[d];
    if (name === 'up') height = Math.max(height, row + length);
    else if (name === 'down') { row = Math.max(row, length - 1); height = Math.max(height, row + 1); }
    else if (name === 'left') width = Math.max(width, col + length);
    else if (name === 'right') { col = Math.max(col, length - 1); width = Math.max(width, col + 1); }
  }
  if (width > GRID_MAX || height > GRID_MAX) return null;
  const probe = new Grid({ type: 'square', width, height });
  const bodyStart = { col, row };
  for (const d of dirs) {
    if (fittedBodyLength(probe, bodyStart, d, length) < length) return null;
  }
  return { width, height, start: bodyStart };
}

/** 从起点沿 dir 的反方向铺开 length 节时，实际落在界内的节数（与初始身体铺设方式一致） */
function fittedBodyLength(grid, start, dir, length) {
  let cur = { ...start };
  let n = 1;
  const back = grid.opposite(dir);
  const wrap = grid.boundary === 'wrap';
  // 环绕边界下身体可以跨越接缝继续铺设，可用节数上限即整张地图（再多必然重叠）
  const cap = wrap ? Math.min(length, grid.size) : length;
  for (let i = 1; i < cap; i++) {
    cur = grid.step(cur, back);
    if (wrap) cur = grid.wrap(cur);
    else if (!grid.inBounds(cur)) break;
    n++;
  }
  return n;
}

function dirsOf(grid, direction) {
  if (direction === 'random') return Array.from({ length: grid.dirCount }, (_, i) => i);
  return [parseDir(direction, grid.type)];
}

function dirsLabel(grid, dirs) {
  if (dirs.length > 1) return '任意方向的最坏情况';
  return DIR_LABEL_CN[grid.dirNames[dirs[0]]] || grid.dirNames[dirs[0]];
}

/**
 * 检测「意外情况」并给出可执行的修复建议。
 * 覆盖：起点越界、蛇身长度超过地图尺寸、初始身体被边界截断、增长上限/目标长度超出总格数、
 *       起点被阻塞状态占据，以及权重与规则配置层面的常见空转。
 */
function diagnoseConfig(rawInput = {}) {
  if (!rawInput || typeof rawInput !== 'object') {
    return [{ level: 'error', code: 'invalidConfig', title: '配置无效', message: '配置必须是一个 JSON 对象。', suggestions: [] }];
  }
  const raw = rawInput;
  const cfg = normalizeConfig(raw);
  const grid = new Grid(cfg.grid);
  const w = grid.width;
  const h = grid.height;
  const cells = grid.size;
  const center = centerCoord(grid);
  const out = [];

  /* 1. 起点越界：规范化会把起点收敛进网格，这里按原始值报告 */
  const startRaw = raw.start || {};
  const rawCol = Number(startRaw.col ?? startRaw.x);
  const rawRow = Number(startRaw.row ?? startRaw.y);
  const bodyOn = isBodyEnabled(cfg);
  const badCol = Number.isFinite(rawCol) && (rawCol < 0 || rawCol > w - 1);
  const badRow = Number.isFinite(rawRow) && (rawRow < 0 || rawRow > h - 1);
  if (bodyOn && (badCol || badRow)) {
    const dispCol = Number.isFinite(rawCol) ? Math.round(rawCol) : '?';
    const dispRow = Number.isFinite(rawRow) ? Math.round(rawRow) : '?';
    const fit = {
      width: clamp(Number.isFinite(rawCol) ? Math.max(w, Math.ceil(rawCol) + 1) : w, 2, GRID_MAX),
      height: clamp(Number.isFinite(rawRow) ? Math.max(h, Math.ceil(rawRow) + 1) : h, 2, GRID_MAX),
    };
    out.push({
      level: 'error',
      code: 'startOutOfBounds',
      title: '起点超出地图边界',
      message: `起点 (${dispCol}, ${dispRow}) 不在网格范围内（col 0..${w - 1}，row 0..${h - 1}），运行时已自动收敛到 (${cfg.start.col}, ${cfg.start.row})。`,
      suggestions: [
        { label: `起点移至地图中心 (${center.col}, ${center.row})`, patch: { start: { ...center } } },
        { label: `扩大地图到 ${fit.width}×${fit.height} 以包含原起点`, patch: { grid: fit } },
      ],
    });
  }

  /* 2. 蛇身长度与地图尺寸（蛇形实体被禁用时不再检查） */
  const length = Math.max(1, Math.round(Number(cfg.body.initialLength) || 1));
  const dirs = dirsOf(grid, cfg.start.direction);
  if (!bodyOn) {
    // 已完全禁用蛇形实体：只提示本次运行不会出现移动体
    out.push({
      level: 'info',
      code: 'bodyDisabled',
      title: '蛇形实体已完全禁用',
      message: '本次运行不会生成任何蛇形实体，画面只呈现环境状态（含元胞自动机）的演化。',
      suggestions: [
        { label: '恢复蛇形实体（初始长度 3）', patch: { body: { enabled: true, initialLength: 3 } } },
      ],
    });
  } else if (length > cells) {
    // 直线上排下 length 节，网格至少要在身体延伸方向上够长；expandGridForBody 会同时给出合适的起点
    const fitted = Math.min(...dirs.map((d) => fittedBodyLength(grid, cfg.start, d, length)));
    const expand = expandGridForBody(grid, cfg.start, dirs, length);
    const fit = expand ? { width: expand.width, height: expand.height } : gridSizeFor(length, w, h);
    const fitStart = expand ? { ...expand.start } : { ...centerCoord(new Grid({ type: cfg.grid.type, ...fit })) };
    out.push({
      level: 'error',
      code: 'bodyExceedsGrid',
      title: '蛇身长度超过地图尺寸',
      message: `初始长度 ${length} 节 > 地图总格数 ${cells}（${w}×${h}），蛇身不可能完整容纳，体节必然重叠。`,
      suggestions: [
        { label: `初始长度改为 ${fitted}（当前起点/方向可容纳的最大长度）`, patch: { body: { initialLength: fitted } } },
        {
          label: `地图扩大到 ${fit.width}×${fit.height} 并把起点移到 (${fitStart.col}, ${fitStart.row})`,
          patch: { grid: fit, start: fitStart },
        },
      ],
    });
  } else if (length > 1) {
    const fitted = Math.min(...dirs.map((d) => fittedBodyLength(grid, cfg.start, d, length)));
    if (fitted < length) {
      const centerFitted = Math.min(...dirs.map((d) => fittedBodyLength(grid, center, d, length)));
      const expand = expandGridForBody(grid, cfg.start, dirs, length);
      const suggestions = [];
      if (centerFitted > fitted) {
        suggestions.push({ label: `起点移至地图中心 (${center.col}, ${center.row})（可容纳 ${centerFitted} 节）`, patch: { start: { ...center } } });
      }
      suggestions.push({ label: `初始长度改为 ${fitted}`, patch: { body: { initialLength: fitted } } });
      if (expand) {
        suggestions.push({ label: `地图扩大到 ${expand.width}×${expand.height} 以容纳 ${length} 节`, patch: { grid: { width: expand.width, height: expand.height }, start: { ...expand.start } } });
      }
      out.push({
        level: 'error',
        code: 'bodyTruncatedByBoundary',
        title: '蛇的初始身体会被地图边界截断',
        message: `起点 (${cfg.start.col}, ${cfg.start.row}) 朝${dirsLabel(grid, dirs)}的反方向只能排下 ${fitted} 节，初始长度 ${length} 节会被截断为 ${fitted} 节。`,
        suggestions,
      });
    }
  }

  /* 3. 增长上限 / 结束条件的目标长度超过地图总格数 */
  const lp = cfg.body.lengthPolicy;
  if (lp.mode !== 'fixed' && lp.growth.enabled && lp.growth.maxLength > cells) {
    const fit = gridSizeFor(lp.growth.maxLength, w, h);
    out.push({
      level: 'warning',
      code: 'growthExceedsGrid',
      title: '增长上限超过地图尺寸',
      message: `增长上限 ${lp.growth.maxLength} 节 > 地图总格数 ${cells}，长度永远达不到该上限，超出的部分只会让体节互相重叠。`,
      suggestions: [
        { label: `增长上限改为 ${cells}`, patch: { body: { lengthPolicy: { growth: { maxLength: cells } } } } },
        { label: `地图扩大到 ${fit.width}×${fit.height}`, patch: { grid: fit } },
      ],
    });
  }
  if (cfg.endConditions.lengthReached && cfg.endConditions.lengthTarget > cells) {
    const fit = gridSizeFor(cfg.endConditions.lengthTarget, w, h);
    out.push({
      level: 'warning',
      code: 'lengthTargetExceedsGrid',
      title: '结束条件的目标长度超过地图尺寸',
      message: `结束条件「达到指定长度 ${cfg.endConditions.lengthTarget}」大于地图总格数 ${cells}，该条件永远不会触发，运行只能靠其它条件收尾。`,
      suggestions: [
        { label: `目标长度改为 ${cells}`, patch: { endConditions: { lengthTarget: cells } } },
        { label: `地图扩大到 ${fit.width}×${fit.height}`, patch: { grid: fit } },
      ],
    });
  }

  /* 4. 起点被阻塞状态占据（CA 初始环境） */
  if (cfg.caMode.enabled) {
    const states = cfg.caMode.states;
    const blocking = new Set(states.filter((s) => s.blocking).map((s) => s.name));
    const init = cfg.caMode.initial;
    if (init.mode === 'pattern') {
      const dim = parsePatternText(init.pattern);
      if (dim.width > w || dim.height > h) {
        const fit = { width: Math.max(w, dim.width), height: Math.max(h, dim.height) };
        out.push({
          level: 'warning',
          code: 'patternExceedsGrid',
          title: 'CA 初始图案大于地图尺寸',
          message: `初始图案为 ${dim.width}×${dim.height}，大于地图 ${w}×${h}，超出部分会被直接裁掉，图案也无法正常居中。`,
          suggestions: [
            { label: `地图扩大到 ${fit.width}×${fit.height}`, patch: { grid: fit } },
            { label: '改用随机填充（密度 30%）', patch: { caMode: { initial: { mode: 'random', density: 0.3 } } } },
          ],
        });
      }
      const name = patternStateNameAt(grid, states, init.pattern, { col: cfg.start.col, row: cfg.start.row });
      if (bodyOn && name && blocking.has(name)) {
        const cleared = clearPatternCell(grid, init.pattern, { col: cfg.start.col, row: cfg.start.row });
        const suggestions = [];
        if (cleared !== null) suggestions.push({ label: '把起点格从初始图案中清空', patch: { caMode: { initial: { pattern: cleared } } } });
        suggestions.push({ label: `起点移至地图中心 (${center.col}, ${center.row})`, patch: { start: { ...center } } });
        suggestions.push({ label: `初始长度改为 1（避免身体压在阻塞格上）`, patch: { body: { initialLength: 1 } } });
        out.push({
          level: 'error',
          code: 'startBlocked',
          title: '起点被阻塞状态占据',
          message: `起点 (${cfg.start.col}, ${cfg.start.row}) 在 CA 初始图案中是「${name}」（阻塞状态），运行时第一步就会判定为撞障碍物。`,
          suggestions,
        });
      }
    } else if (bodyOn && init.mode === 'random' && init.density > 0 && blocking.has(init.state)) {
      out.push({
        level: 'warning',
        code: 'startMayBeBlocked',
        title: '起点可能被随机填充的阻塞状态占据',
        message: `CA 初始以 ${(init.density * 100).toFixed(0)}% 密度随机填充「${init.state}」（阻塞状态），起点被阻塞的概率约为 ${(init.density * 100).toFixed(0)}%（同一种子结果可复现）。`,
        suggestions: [
          { label: '把初始密度降到 5%', patch: { caMode: { initial: { density: 0.05 } } } },
          { label: `起点移至地图中心 (${center.col}, ${center.row})`, patch: { start: { ...center } } },
        ],
      });
    }
  }

  /* 5. 常见「空转」配置 */
  const moves = cfg.moveRules;
  if (moves.left + moves.straight + moves.right <= 0) {
    out.push({
      level: 'warning',
      code: 'zeroMoveWeights',
      title: '左/直/右权重全为 0',
      message: '运行时会退化为均匀分布，实际并非「不转向」。',
      suggestions: [{ label: '恢复等概率（左 1 : 直 1 : 右 1）', patch: { moveRules: { left: 1, straight: 1, right: 1 } } }],
    });
  }
  for (const r of cfg.environmentRules) {
    if (!r.actions.length) {
      out.push({
        level: 'warning',
        code: 'ruleWithoutAction',
        title: `规则「${r.name}」没有后果动作`,

      finalFrameIndex: frames.length - 1,
      summary: {
        steps: stats.steps,
        collisions: stats.collisions,
        selfCollisions: stats.selfCollisions,
        maxLength: stats.maxLength,
        coverage: stats.coverage,
        ruleTriggers: stats.ruleTriggers,
        caSteps: stats.caSteps,
        obstacleCount: stats.obstacleCount,
        markerCount: stats.markerCount,
        agents: stats.agents,
        peakAgents: stats.peakAgents,
        spawns: stats.spawns,
        agentDeaths: stats.agentDeaths,
        merges: stats.merges,
        endReason: endReason ? endReason.label : '未结束（达到帧上限）',
        finalLength: frameStats.length ?? stats.length,
        /** 得分系统：总分 / 等级 / 分项，由 core/score.js 纯函数折算 */
        score: computeScore(stats, grid, endReason),
      },
    };
  }

  /* ------------------------------------------------------------------ */

  /**
   * 推进一帧：
   *   1. 移动前 CA → 2. 移动前规则 → 3. 逐个移动体推进 → 4. 多蛇交互
   *   → 5. 移动后/进入/定时规则 → 6. 生成新蛇 → 7. 移动后 CA → 8. 结束条件
   */
  stepOnce(ctx, engine, ca, tickEvents) {
    const cfg = ctx.config;
    const stats = ctx.stats;
    const agents = ctx.agents;
    const sync = cfg.ruleExecution === 'sync';
    const main = agents.find((a) => a.isMain) || agents[0] || null;
    ctx.agent = main;

    // 1. 元胞自动机（移动前）
    if (ca && cfg.caMode.syncWithAgent === 'beforeMove') this.runCA(ctx);

    // 2. 移动前规则
    stats.ruleTriggers += engine.run('beforeStep', ctx, { sync });
    if (ctx.pending.end) return { ended: true, reason: this.ruleEndReason(ctx) };

    // 3. 逐个移动体推进（单蛇运行时与旧行为完全一致）
    let fatal = null;
    for (const agent of agents.slice()) {
      if (!agent.alive) continue;
      // 记录移动前状态：排斥模式下发生重叠时用于回退
      agent.prevState = {
        segments: agent.segments.map((s) => ({ col: s.col, row: s.row })),
        dir: agent.dir,
      };
      const res = this.stepAgent(ctx, engine, agent, tickEvents);
      if (res && res.ended) {
        if (agent.isMain) { fatal = res.reason; break; }
      }
    }
    ctx.agent = main;
    if (fatal) return { ended: true, reason: fatal, turn: main ? main.lastTurn : null };

    // 4. 多蛇交互（碰撞 / 融合 / 排斥）
    const inter = this.resolveAgentInteractions(ctx, tickEvents);
    if (inter && inter.fatal) return { ended: true, reason: inter.reason };

    // 5. 移动后 / 进入新格 / 定时规则（每步一次，面向全体移动体）
    stats.ruleTriggers += engine.run('onEnter', ctx, { sync });
    stats.ruleTriggers += engine.run('afterStep', ctx, { sync });
    stats.ruleTriggers += engine.run('timer', ctx, { sync });
    if (ctx.pending.end) return { ended: true, reason: this.ruleEndReason(ctx), turn: main ? main.lastTurn : null };

    // 6. 多蛇生成
    this.maybeSpawn(ctx, tickEvents);

    // 7. 元胞自动机（移动后 / 每隔 N 步）
    if (ca && cfg.caMode.syncWithAgent === 'afterMove') this.runCA(ctx);
    if (ca && cfg.caMode.syncWithAgent === 'everyN' && ctx.tick % cfg.caMode.every === 0) this.runCA(ctx);

    // 8. 结束条件
    const endCheck = this.checkEndConditions(ctx, tickEvents);
    if (endCheck) return { ended: true, reason: endCheck, turn: main ? main.lastTurn : null };

    // 清理已消失的移动体（保留死亡信息于统计与事件中）
    for (let i = agents.length - 1; i >= 0; i--) {
      if (!agents[i].alive) agents.splice(i, 1);
    }

    return { ended: false, turn: main ? main.lastTurn : null };
  }

  /**
   * 推进单个移动体一步（原 stepOnce 主体）。
   * 主移动体的终止原因会终止整场运行；其它移动体只会自行消失。
   */
  stepAgent(ctx, engine, agent, tickEvents) {
    const cfg = ctx.config;
    const grid = ctx.grid;
    const rng = ctx.rng;
    const stats = ctx.stats;
    const sync = cfg.ruleExecution === 'sync';

    if (!agent.alive) return { ended: false };

    // 1. 决定方向
    const decision = this.decideDirection(ctx, engine, agent);
    let dir = decision.dir;
    const turnKey = decision.turnKey;
    agent.lastTurn = turnKey;

    // 2. 边界处理
    let target = grid.step(agent.head, dir);
    let wallHit = false;
    let outOfBounds = false;

    if (!grid.inBounds(target)) {
      outOfBounds = true;
      const mode = cfg.grid.boundary;
      if (mode === 'wrap') {
        // 记录穿越：起始格在网格外（滑出的一侧），落点格在对侧（滑入的一侧）。
        // 渲染层据此绘制「穿梭」特效，让边界穿越在画面上可见。
        const exit = { ...target };
        target = grid.wrap(target);
        ctx.highlights.push({
          col: target.col,
          row: target.row,
          type: 'wrap',
          fromCol: exit.col,
          fromRow: exit.row,
          dir,
          agentId: agent.id,
        });
      } else if (mode === 'bounce') {
        dir = grid.opposite(dir);
        const t2 = grid.step(agent.head, dir);
        if (grid.inBounds(t2)) target = t2;
        else wallHit = true;
      } else if (mode === 'randomTurn') {
        const options = [];
        for (let d = 0; d < grid.dirCount; d++) {
          const c = this.resolveCandidate(ctx, grid.step(agent.head, d));
          if (c.ok && !this.isBlocked(ctx, c.coord)) options.push({ d, t: c.coord });
        }
        if (options.length) {
          const pick = rng.pick(options);
          dir = pick.d;
          target = pick.t;
        } else {
          wallHit = true;
        }
      } else if (mode === 'custom') {
        ctx.pending.forcedTurns = [];
        engine.run('onBoundary', ctx, { sync: false });
        if (ctx.pending.forcedTurns.length) {
          dir = resolveTurn(ctx.pending.forcedTurns[0].turn, agent, grid, rng);
          const c = this.resolveCandidate(ctx, grid.step(agent.head, dir));
          if (c.ok) target = c.coord;
          else wallHit = true;
        } else {
          wallHit = true;
        }
        agent.forcedNextTurn = null;
      } else {
        wallHit = true;
      }
    }

    // 3. 撞墙/越界处理
    if (wallHit) {
      agent.dir = dir;
      stats.collisions++;
      stats.collisionsTotal++;
      tickEvents.push({ type: 'wall', coord: agent.head, outOfBounds });
      ctx.highlights.push({ col: agent.head.col, row: agent.head.row, type: 'wall', tick: ctx.tick });
      stats.selfCollisionsConsecutive = 0; // 撞墙不是自撞，打断连续自撞计数
      const cfgEnd = cfg.endConditions;
      const hitCode = cfgEnd.priority.find((c) => (c === 'wall' || c === 'outOfBounds') && cfgEnd[c]);
      if (hitCode) {
        return this.agentEnd(ctx, agent, {
          code: hitCode,
          label: END_LABELS[hitCode],
          tick: ctx.tick,
          coord: { ...agent.head },
        }, tickEvents);
      }
      return { ended: false, turn: turnKey };
    }

    // 4. 障碍物处理
    if (ctx.world.isBlocking(target)) {
      const policy = cfg.collision.obstacle;
      if (policy === 'destroy') {
        ctx.world.set(target, 'empty');
        ctx.cellsDirty = true;
        tickEvents.push({ type: 'obstacleDestroyed', coord: { ...target } });
      } else if (policy === 'pass') {
        tickEvents.push({ type: 'obstaclePass', coord: { ...target } });
      } else if (policy === 'turn') {
        const options = [];
        for (let d = 0; d < grid.dirCount; d++) {
          const c = this.resolveCandidate(ctx, grid.step(agent.head, d));
          if (c.ok && !this.isBlocked(ctx, c.coord)) options.push({ d, t: c.coord });
        }
        if (options.length) {
          const pick = rng.pick(options);
          dir = pick.d;
          target = pick.t;
        } else {
          return this.agentEnd(ctx, agent, { code: 'noMove', label: END_LABELS.noMove, tick: ctx.tick, coord: { ...agent.head } }, tickEvents);
        }
      } else {
        stats.collisions++;
        stats.collisionsTotal++;
        stats.collisionsConsecutive++;
        stats.selfCollisionsConsecutive = 0; // 撞障碍物不是自撞，打断连续自撞计数
        tickEvents.push({ type: 'obstacle', coord: { ...target } });
        ctx.highlights.push({ col: target.col, row: target.row, type: 'collision', tick: ctx.tick });
        if (cfg.endConditions.obstacle) {
          return this.agentEnd(ctx, agent, { code: 'obstacle', label: END_LABELS.obstacle, tick: ctx.tick, coord: { ...target } }, tickEvents);
        }
        return { ended: false, turn: turnKey };
      }
    }

    // 5. 交互标记物反馈（在长度策略之前结算，长度变化通过 ctx.pending 注入）
    const ateCell = ctx.world.get(target) === 'marker';
    this.applyMarkerInteraction(ctx, agent, target, tickEvents);

    // 6. 长度变化需求（先算，决定尾巴是否腾出）
    const lengthPlan = this.planLength(ctx, agent, target, tickEvents, ateCell);
    const willGrow = lengthPlan.desired > agent.length;

    // 7. 碰撞检测（自撞 / 撞其他移动体）
    const collision = this.detectCollision(ctx, agent, target, willGrow);
    if (collision) {
      stats.collisions++;
      stats.collisionsTotal++;
      stats.collisionsConsecutive++;
      if (collision === 'self') {
        stats.selfCollisions++;
        stats.selfCollisionsConsecutive++;
      } else {
        // 撞到其它移动体：不计入「自撞」统计，避免污染自撞结束规则
        stats.selfCollisionsConsecutive = 0;
      }
      tickEvents.push({ type: 'selfCollision', coord: { ...target }, kind: collision });
      ctx.highlights.push({ col: target.col, row: target.row, type: 'collision', tick: ctx.tick });
      stats.ruleTriggers += engine.run('onCollision', ctx, { sync });

      const policy = cfg.selfCollisionPolicy;
      // 「自撞是否结束运行」唯一由结束规则「撞到自身」决定：
      // 未勾选时，停止类策略（立即停止 / 自定义）退化为「忽略并继续」，
      // 且「连续自撞上限」也不再结束运行，避免蛇原地卡死。
      const endsRun = collision === 'self' && !!cfg.endConditions.selfCollision;
      const stopReason = { code: 'selfCollision', label: END_LABELS.selfCollision, tick: ctx.tick, coord: { ...target } };
      if (ctx.pending.forcedTurns.length) {
        dir = resolveTurn(ctx.pending.forcedTurns[0].turn, agent, grid, rng);
        const c = this.resolveCandidate(ctx, grid.step(agent.head, dir));
        if (c.ok && !this.detectCollision(ctx, agent, c.coord, false) && !ctx.world.isBlocking(c.coord)) {
          target = c.coord;
        }
      } else {
        switch (policy.action) {
          case 'ignore':
            break;
          case 'forceStraight':
          case 'forceStraightN': {
            agent.pendingForcedStraights = policy.action === 'forceStraight' ? 1 : Math.max(1, policy.n);
            stats.forcedStraights += agent.pendingForcedStraights;
            break;
          }
          case 'randomTurn': {
            const options = [];
            for (let d = 0; d < grid.dirCount; d++) {
              if (d === grid.opposite(dir)) continue;
              const c = this.resolveCandidate(ctx, grid.step(agent.head, d));
              if (c.ok && !this.detectCollision(ctx, agent, c.coord, false) && !ctx.world.isBlocking(c.coord)) options.push({ d, t: c.coord });
            }
            if (options.length) {
              const pick = rng.pick(options);
              dir = pick.d;
              target = pick.t;
            } else if (endsRun) {
              return this.agentEnd(ctx, agent, stopReason, tickEvents);
            }
            break;
          }
          case 'custom':
            if (endsRun) return this.agentEnd(ctx, agent, stopReason, tickEvents);
            break;
          case 'stop':
          default: {
            if (endsRun) return this.agentEnd(ctx, agent, stopReason, tickEvents);
            break;
          }
        }
        if (endsRun && stats.selfCollisionsConsecutive >= policy.maxConsecutive) {
          return this.agentEnd(ctx, agent, { code: 'selfCollision', label: `连续撞到自身 ${stats.selfCollisionsConsecutive} 次`, tick: ctx.tick, coord: { ...target } }, tickEvents);
        }
      }
    } else {
      stats.collisionsConsecutive = 0;
      stats.selfCollisionsConsecutive = 0;
    }

    // 8. 执行移动与长度变化
    agent.dir = dir;
    this.applyMove(ctx, agent, target, lengthPlan);
    stats.maxLength = Math.max(stats.maxLength, agent.length);
    stats.minLength = Math.min(stats.minLength, agent.length);
    for (let i = 0; i < agent.segments.length; i++) {
      stats.visited.add(grid.idx(agent.segments[i].col, agent.segments[i].row));
    }
    stats.coverage = (stats.visited.size / grid.size) * 100;
    if (turnKey === 'left') stats.turnsLeft++;
    else if (turnKey === 'right') stats.turnsRight++;
    else if (turnKey === 'reverse') stats.turnsReverse++;
    else stats.turnsStraight++;

    return { ended: false, turn: turnKey };
  }

  /**
   * 单个移动体的终止处理：
   * 主移动体终止 → 结束整场运行；其它移动体 → 从世界中消失（计入统计与事件）。
   */
  agentEnd(ctx, agent, reason, tickEvents) {
    if (agent.isMain) return { ended: true, reason };
    this.killAgent(ctx, agent, reason, tickEvents);
    return { ended: false };
  }

  /** 让某个移动体消失（死亡 / 被移除 / 被融合） */
  killAgent(ctx, agent, reason, tickEvents) {
    if (!agent.alive) return;
    agent.alive = false;
    agent.endReason = { ...reason, tick: ctx.tick };
    ctx.stats.agentDeaths = (ctx.stats.agentDeaths || 0) + 1;
    if (tickEvents) {
      tickEvents.push({ type: 'agentDeath', coord: { ...agent.head }, highlight: true, reason: reason.code });
    }
  }

  /** 元胞自动机单步演化 + 稳定态检测 */
  runCA(ctx) {
    if (!ctx.ca) return;
    const changed = ctx.ca.step(ctx.world, ctx.rng);
    if (changed) {
      ctx.cellsDirty = true;
      ctx.stats.caStableCount = 0;
    } else {
      ctx.stats.caStableCount = (ctx.stats.caStableCount || 0) + 1;
    }
    ctx.stats.caSteps++;
  }

  ruleEndReason(ctx) {
    const p = ctx.pending.end;
    return { code: p.code || 'ruleEnd', label: p.reason || END_LABELS.ruleEnd, tick: ctx.tick, coord: ctx.agent && ctx.agent.head ? { ...ctx.agent.head } : null };
  }

  isBlocked(ctx, coord) {
    return ctx.world.isBlocking(coord);
  }

  /**
   * 把「可能越界的候选落点」解析为可判定的有效格。
   *
   * 边界穿越（wrap）开启时，越界邻居应当环绕回网格另一侧再参与判定；
   * 否则蛇头位于画布四角等位置时，越界方向会被误判为「不可走」，
   * 进而错误触发「无路可走」（noMove）。
   *
   * @returns {{coord: object|null, ok: boolean, wrapped: boolean}}
   *          ok=false 表示该落点在当前边界策略下不可达（如撞墙 / 反弹无路）。
   */
  resolveCandidate(ctx, coord) {
    const grid = ctx.grid;
    if (grid.inBounds(coord)) return { coord, ok: true, wrapped: false };
    if (ctx.config.grid.boundary === 'wrap') {
      return { coord: grid.wrap(coord), ok: true, wrapped: true };
    }
    return { coord: null, ok: false, wrapped: false };
  }

  /** 目标格是否落在自身身体上（不含头部），兼容边界穿越 */
  selfBlocks(ctx, agent, target) {
    const grid = ctx.grid;
    const c = this.resolveCandidate(ctx, target);
    if (!c.ok) return false;
    const index = grid.idx(c.coord.col, c.coord.row);
    for (let i = 1; i < agent.segments.length; i++) {
      if (grid.idx(agent.segments[i].col, agent.segments[i].row) === index) return true;
    }
    return false;
  }

  /**
   * 安全避撞预设：剔除会撞上自身身体 / 障碍物 / 其它移动体的候选转向。
   * 返回空数组表示「所有方向都不可行」，调用方应回落到原始权重（从而触发原本的碰撞逻辑）。
   * 未启用任何规避项时返回 null，保持与旧版本完全一致的随机序列。
   */
  filterSafeOptions(ctx, agent, options) {
    const cfg = ctx.config;
    const s = cfg.safety;
    const repel = cfg.multiSnake.enabled && cfg.multiSnake.interaction.mode === 'repel';
    const avoidOthers = s.avoidOtherAgents || repel;
    if (!s.avoidBody && !s.avoidObstacle && !avoidOthers) return null;
    const grid = ctx.grid;
    const out = [];
    for (const o of options) {
      if (o.weight <= 0) continue;
      const dir = o.dir !== undefined ? o.dir : resolveTurn(o.key, agent, grid, ctx.rng);
      // 边界穿越开启时，越界候选先环绕回网格内再判定，避免四角位置被误剔；
      // 非穿越边界下越界候选仍照旧保留，交由后续撞墙 / 反弹逻辑处理。
      const c = this.resolveCandidate(ctx, grid.step(agent.head, dir));
      if (!c.ok) { out.push({ ...o, dir }); continue; }
      const target = c.coord;
      if (s.avoidObstacle && ctx.world.isBlocking(target)) continue;
      if (s.avoidBody && this.selfBlocks(ctx, agent, target)) continue;
      if (avoidOthers && occupiedByAgent(ctx, target, agent)) continue;
      out.push({ ...o, dir });
    }
    return out;
  }

  /** 决定下一步转向：规则强制 > 条件概率规则 > 基础左/直/右权重（含安全避撞预设） */
  decideDirection(ctx, engine, self) {
    const cfg = ctx.config;
    const grid = ctx.grid;
    // 多蛇运行时必须用「当前推进的移动体」而不是 ctx.agent（后者始终指向主移动体），
    // 否则生成出来的每条蛇都会沿用主移动体的转向。
    const agent = self || ctx.agent;
    const rng = ctx.rng;

    if (agent.forcedNextTurn) {
      const turn = agent.forcedNextTurn;
      agent.forcedNextTurn = null;
      return { dir: resolveTurn(turn, agent, grid, rng), turnKey: turn };
    }
    if (agent.pendingForcedStraights > 0) {
      agent.pendingForcedStraights--;
      return { dir: agent.dir, turnKey: 'straight' };
    }
    const adv = cfg.advancedRules
      .map((r, i) => ({ r, i }))
      .filter(({ r }) => r.enabled && r.condition)
      .sort((a, b) => (b.r.priority - a.r.priority) || (a.i - b.i));
    let weights = cfg.moveRules;
    for (const { r } of adv) {
      const subject = { coord: agent.head, agent, kind: 'head', segmentIndex: 0, ruleId: r.id };
      if (evaluateCondition(r.condition, subject, ctx)) {
        weights = r.moves;
        break;
      }
    }
    const options = [
      { key: 'left', weight: Math.max(0, weights.left) },
      { key: 'straight', weight: Math.max(0, weights.straight) },
      { key: 'right', weight: Math.max(0, weights.right) },
    ];
    const safe = this.filterSafeOptions(ctx, agent, options);
    const pool = safe && safe.length ? safe : options;
    const { item } = rng.weighted(pool, (o) => o.weight);
    return { dir: item.dir !== undefined ? item.dir : resolveTurn(item.key, agent, grid, rng), turnKey: item.key };
  }

  /**
   * 交互标记物反馈：移动体踏入被配置为「交互标记物」的元胞时，
   * 按反馈规则表产生长度变化（增量 / 指定值 / 百分比）与颜色反馈。
   * 长度变化写入 ctx.pending，随后由 planLength 统一结算与夹取。
   */
  applyMarkerInteraction(ctx, agent, target, tickEvents) {
    const mi = ctx.config.caMode.markerInteraction;
    if (!mi.enabled || !mi.states.length) return null;
    const stateName = ctx.world.get(target);
    if (stateName === null || !mi.states.includes(stateName)) return null;
    const applicable = mi.effects.filter((e) => e.enabled && (!e.state || e.state === stateName));
    if (!applicable.length) return null;

    let consumed = false;
    const applied = [];
    for (const fx of applicable) {
      if (fx.probability <= 0) continue;
      if (fx.probability < 1 && ctx.rng.next() >= fx.probability) continue;
      let delta = 0;
      if (fx.mode === 'set') {
        ctx.pending.setLength = fx.value;
        delta = fx.value - agent.length;
      } else if (fx.mode === 'percent') {
        delta = Math.round((agent.length * fx.value) / 100);
        ctx.pending.lengthDelta += delta;
      } else {
        delta = fx.value;
        ctx.pending.lengthDelta += delta;
      }
      if (fx.consume && !consumed) {
        ctx.world.set(target, fx.consumeTo);
        ctx.cellsDirty = true;
        consumed = true;
      }
      applied.push({ name: fx.name, delta });
      tickEvents.push({
        type: 'markerInteraction',
        coord: { ...target },
        state: stateName,
        effect: fx.name,
        delta,
        highlight: true,
        color: fx.color || '',
      });
      ctx.highlights.push({ col: target.col, row: target.row, type: 'markerEffect', state: stateName, tick: ctx.tick, color: fx.color || '' });
    }
    if (!applied.length) return null;
    ctx.stats.markerInteractions = (ctx.stats.markerInteractions || 0) + applied.length;
    return { state: stateName, consumed, applied };
  }

  /** 计算本步长度目标 */
  planLength(ctx, agent, target, tickEvents, ateOverride) {
    const cfg = ctx.config;
    const rng = ctx.rng;
    const lp = cfg.body.lengthPolicy;
    let delta = ctx.pending.lengthDelta;
    const ate = ateOverride === undefined ? ctx.world.get(target) === 'marker' : ateOverride;

    if (lp.mode !== 'fixed') {
      const triggerOk = (sub) => {
        if (!sub.enabled) return false;
        switch (sub.trigger) {
          case 'step':
          case 'timer':
            return ctx.tick % Math.max(1, sub.interval) === 0;
          case 'eat':
            return ate;
          case 'collision':
            return tickEvents.some((e) => e.type === 'selfCollision');
          default:
            return false;
        }
      };
      if (triggerOk(lp.growth) && rng.next() < lp.growth.probability) {
        delta += lp.growth.amount;
